# Production deployment: app + Caddy (automatic HTTPS). See DEPLOY.md.
services:
  app:
    # Published by the "Publish Docker image" workflow — `docker compose
    # pull` fetches it, so the VPS never has to build. `build: .` stays so
    # `docker compose up --build` still works from a source checkout.
    image: ghcr.io/gregorybleiker/attendancetracker:main
    build: .
    # Run pending migrations, then start the Phoenix server.
    command: ["sh", "-c", "/app/bin/migrate && /app/bin/server"]
    ports: ["4000:4000"]
    env_file:
      - .env
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      DATABASE_PATH: /data/attendancetracker.db
    volumes:
      # SQLite database + uploaded photos (see the /data setup in Dockerfile).
      - app-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      # Mount the directory (not the file): single-file bind mounts break
      # under rootless Podman/crun on WSL with "Not a directory".
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
  caddy-config:
